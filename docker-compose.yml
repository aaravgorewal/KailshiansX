version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: kailshiansx_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kailshiansx
      POSTGRES_PASSWORD: kailshiansx_dev
      POSTGRES_DB: kailshiansx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kailshiansx"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
